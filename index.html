<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VLearn — Shutdown</title>

<link rel="icon" type="image/png" href="Logo.png">

<style>
/* =========================================================
   VLEARN SHUTDOWN PAGE
   Pure black + white memorial space aesthetic
   ========================================================= */

:root {
    --black: #000;
    --white: #fff;
    --soft-white: rgba(255,255,255,.72);
    --dim-white: rgba(255,255,255,.42);
}

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    background: #000;
    color: #fff;
    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    overflow: hidden;
    -webkit-font-smoothing: antialiased;
}

/* =========================================================
   SPACE
   ========================================================= */

.space {
    position: fixed;
    inset: 0;
    background: #000;
    overflow: hidden;
}

#stars {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 1;
}

/* Very subtle vignette */
.space::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 2;

    background:
        radial-gradient(
            circle at center,
            transparent 30%,
            rgba(0,0,0,.28) 70%,
            rgba(0,0,0,.8) 100%
        );
}

/* =========================================================
   MAIN SHUTDOWN MESSAGE
   ========================================================= */

.shutdown {
    position: absolute;
    z-index: 20;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: min(850px, 90vw);

    text-align: center;

    pointer-events: none;
}

/* Small VLearn identifier */
.brand {
    margin-bottom: 28px;

    font-size: 14px;
    font-weight: 700;

    letter-spacing: .45em;
    text-transform: uppercase;

    color: var(--dim-white);

    animation: fadeIn 2s ease both;
}

/* Main heading */
.shutdown h1 {
    margin: 0;

    font-size: clamp(42px, 7vw, 92px);
    line-height: 1.02;

    font-weight: 800;
    letter-spacing: -.045em;

    color: #fff;

    animation:
        titleIn 1.6s cubic-bezier(.16,1,.3,1) both;
}

/* Description */
.message {
    margin: 25px auto 0;

    font-size: clamp(16px, 2vw, 21px);
    line-height: 1.7;

    font-weight: 400;

    color: var(--soft-white);

    animation:
        fadeUp 1.4s .45s cubic-bezier(.16,1,.3,1) both;
}

/* Date */
.date {
    margin-top: 13px;

    font-size: 13px;
    letter-spacing: .25em;

    color: var(--dim-white);

    animation:
        fadeUp 1.4s .7s cubic-bezier(.16,1,.3,1) both;
}

/* =========================================================
   SHUTDOWN NOTICE BUTTON
   ========================================================= */

.notice-button {
    display: inline-flex;

    margin-top: 38px;

    padding: 13px 25px;

    border: 1px solid rgba(255,255,255,.55);
    border-radius: 999px;

    background: rgba(255,255,255,.04);

    color: #fff;

    text-decoration: none;

    font-size: 14px;
    font-weight: 700;

    letter-spacing: .06em;

    transition:
        background .3s ease,
        color .3s ease,
        border-color .3s ease,
        transform .3s ease;

    pointer-events: auto;

    animation:
        fadeUp 1.4s 1s cubic-bezier(.16,1,.3,1) both;
}

.notice-button:hover {
    background: #fff;
    color: #000;
    border-color: #fff;

    transform: translateY(-3px);
}

.notice-button:active {
    transform: translateY(-1px);
}

/* =========================================================
   COPYRIGHT
   ========================================================= */

.copyright {
    position: fixed;

    left: 50%;
    bottom: 25px;

    transform: translateX(-50%);

    z-index: 20;

    width: 90%;

    text-align: center;

    color: rgba(255,255,255,.38);

    font-size: 11px;
    line-height: 1.6;

    letter-spacing: .08em;

    animation:
        fadeIn 2s 1.4s ease both;
}

/* =========================================================
   FLOATING CREDITS
   ========================================================= */

.credits-layer {
    position: absolute;
    inset: 0;

    z-index: 8;

    pointer-events: none;

    overflow: hidden;
}

/*
   Each credit begins below the screen and travels
   diagonally upward.

   We use two sides:
   LEFT  -> travels up/right
   RIGHT -> travels up/left
*/

.credit {
    position: absolute;

    bottom: -130px;

    width: max-content;
    max-width: 280px;

    color: rgba(255,255,255,.20);

    font-size: clamp(11px, 1.1vw, 15px);
    line-height: 1.45;

    letter-spacing: .05em;

    white-space: nowrap;

    will-change: transform, opacity;

    text-align: center;
}

/* Individual movement paths */

.credit.left {
    left: var(--start);

    animation:
        floatLeft var(--duration) linear var(--delay) infinite;
}

.credit.right {
    right: var(--start);

    animation:
        floatRight var(--duration) linear var(--delay) infinite;
}

.credit strong {
    display: block;

    color: rgba(255,255,255,.48);

    font-size: 1em;
    font-weight: 700;
}

.credit span {
    display: block;

    color: rgba(255,255,255,.18);

    font-size: .82em;
}

/* Left side: rises toward center/right */
@keyframes floatLeft {

    0% {
        transform:
            translate3d(0, 0, 0)
            rotate(var(--angle))
            scale(.82);

        opacity: 0;
    }

    8% {
        opacity: .9;
    }

    35% {
        opacity: .72;
    }

    70% {
        opacity: .48;
    }

    90% {
        opacity: .15;
    }

    100% {
        transform:
            translate3d(var(--travel-x), -125vh, 0)
            rotate(calc(var(--angle) * -0.35))
            scale(1.05);

        opacity: 0;
    }
}

/* Right side: rises toward center/left */
@keyframes floatRight {

    0% {
        transform:
            translate3d(0, 0, 0)
            rotate(var(--angle))
            scale(.82);

        opacity: 0;
    }

    8% {
        opacity: .9;
    }

    35% {
        opacity: .72;
    }

    70% {
        opacity: .48;
    }

    90% {
        opacity: .15;
    }

    100% {
        transform:
            translate3d(var(--travel-x), -125vh, 0)
            rotate(calc(var(--angle) * -0.35))
            scale(1.05);

        opacity: 0;
    }
}

/* =========================================================
   ENTRANCE ANIMATIONS
   ========================================================= */

@keyframes fadeIn {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

@keyframes fadeUp {

    from {
        opacity: 0;
        transform: translateY(25px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes titleIn {

    from {
        opacity: 0;
        transform:
            translateY(35px)
            scale(.96);
    }

    to {
        opacity: 1;
        transform:
            translateY(0)
            scale(1);
    }
}

/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 700px) {

    .brand {
        font-size: 11px;
        letter-spacing: .3em;
        margin-bottom: 20px;
    }

    .shutdown h1 {
        font-size: clamp(38px, 12vw, 65px);
    }

    .message {
        font-size: 15px;
        line-height: 1.6;
    }

    .date {
        font-size: 10px;
        letter-spacing: .16em;
    }

    .notice-button {
        margin-top: 30px;
        padding: 12px 21px;
    }

    .credit {
        font-size: 10px;
    }

    .copyright {
        bottom: 17px;
        font-size: 9px;
    }
}

/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
    }
}
</style>
</head>

<body>

<div class="space">

    <!-- =====================================================
         STARFIELD
         ===================================================== -->

    <canvas id="stars"></canvas>


    <!-- =====================================================
         FLOATING CREDITS
         ===================================================== -->

    <div class="credits-layer" id="credits"></div>


    <!-- =====================================================
         MAIN MESSAGE
         ===================================================== -->

    <main class="shutdown">

        <div class="brand">
            VLearn
        </div>

        <h1>
            VLearn has shutdown!
        </h1>

        <p class="message">
            Thanks for using our services.
        </p>

        <div class="date">
            FEBRUARY 2025 — DECEMBER 2026
        </div>

        <https://iifsgfipnximqzuhsjvj.supabase.co/storage/v1/object/public/tredt-files/public/SHUTDOWN%20NOTICE%20OF%20VLEARN.pdf>
        <a
            class="notice-button"
            href="#"
            id="shutdownNotice"
        >
            Shutdown Notice
        </a>

    </main>


    <!-- =====================================================
         COPYRIGHT
         ===================================================== -->

    <footer class="copyright">
        ©TREDT Publications Society. All Rights Reserved.
    </footer>

</div>


<script>
/* =========================================================
   VLEARN SHUTDOWN STARFIELD
   ========================================================= */

const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");

let width;
let height;
let stars = [];

const STAR_COUNT = 520;


/* =========================================================
   RESIZE
   ========================================================= */

function resize() {

    width = window.innerWidth;
    height = window.innerHeight;

    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = width * dpr;
    canvas.height = height * dpr;

    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    createStars();
}


/* =========================================================
   CREATE STARS
   ========================================================= */

function createStars() {

    stars = [];

    for (let i = 0; i < STAR_COUNT; i++) {

        stars.push({
            angle: Math.random() * Math.PI * 2,

            distance:
                Math.random() *
                Math.sqrt(width * width + height * height),

            radius:
                Math.random() * 1.35 + .15,

            speed:
                (Math.random() * .00018) + .000035,

            alpha:
                Math.random() * .75 + .2,

            twinkle:
                Math.random() * Math.PI * 2,

            twinkleSpeed:
                Math.random() * .02 + .004
        });
    }
}


/* =========================================================
   DRAW REVOLVING STARFIELD
   ========================================================= */

function drawStars(time) {

    ctx.clearRect(0, 0, width, height);

    /*
       Slightly off-center orbital point gives the starfield
       a natural cinematic movement.
    */

    const centerX = width * .5;
    const centerY = height * .5;

    for (const star of stars) {

        star.angle += star.speed;

        const x =
            centerX +
            Math.cos(star.angle) * star.distance;

        const y =
            centerY +
            Math.sin(star.angle) *
            star.distance *
            .58;

        /*
           Twinkle
        */

        const pulse =
            .72 +
            Math.sin(
                time * star.twinkleSpeed +
                star.twinkle
            ) * .28;

        const alpha =
            star.alpha * pulse;

        /*
           Keep stars that leave the viewport invisible.
        */

        if (
            x < -10 ||
            x > width + 10 ||
            y < -10 ||
            y > height + 10
        ) {
            continue;
        }

        ctx.globalAlpha = alpha;
        ctx.fillStyle = "#fff";

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            star.radius,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.globalAlpha = 1;

    requestAnimationFrame(drawStars);
}


/* =========================================================
   START STARFIELD
   ========================================================= */

window.addEventListener("resize", resize);

resize();

requestAnimationFrame(drawStars);


/* =========================================================
   FLOATING CREDIT DATA
   ========================================================= */

const creditData = [

    ["Soumya D. Das", "Head Developer"],
    ["Ishaan Das", "Compiler and Designer"],
    ["Kush Meena", "Head Designer"],
    ["Arya Dogra", "Designer and Compiler"],
    ["Naved Khan", "Designer and Compiler"],
    ["Hemang Chugh", "Music Artist"],
    ["Benjamin Samuel", "Music Artist"],
    ["Sam Thomas", "Designer and Music Artist"],
    ["Aaron S. Santhosh", "Server Management"],

    ["LearnCBSE", "Content"],

    ["Aryan Bhatt Bhutta Company", ""],
    ["Aryan Bhatt Software Foundation", ""],

    ["admin1", ""]
];


/* =========================================================
   GENERATE FLOATING CREDITS
   ========================================================= */

const creditsContainer =
    document.getElementById("credits");


function createCredit(
    index,
    data,
    side
) {

    const credit =
        document.createElement("div");

    credit.className =
        "credit " + side;

    const name =
        document.createElement("strong");

    name.textContent = data[0];

    credit.appendChild(name);


    if (data[1]) {

        const role =
            document.createElement("span");

        role.textContent = data[1];

        credit.appendChild(role);
    }


    /*
       Different positions and trajectories ensure
       that the names don't move like a simple slideshow.
    */

    const start =
        2 + Math.random() * 25;

    const duration =
        17 + Math.random() * 14;

    const delay =
        -Math.random() * duration;

    const angle =
        side === "left"
            ? -12 - Math.random() * 18
            : 12 + Math.random() * 18;

    const travel =
        side === "left"
            ? 180 + Math.random() * 260
            : -(180 + Math.random() * 260);


    credit.style.setProperty(
        "--start",
        start + "vw"
    );

    credit.style.setProperty(
        "--duration",
        duration + "s"
    );

    credit.style.setProperty(
        "--delay",
        delay + "s"
    );

    credit.style.setProperty(
        "--angle",
        angle + "deg"
    );

    credit.style.setProperty(
        "--travel-x",
        travel + "px"
    );


    /*
       Random vertical starting offset makes the
       streams continuously populated.
    */

    credit.style.bottom =
        (-80 - Math.random() * 500) + "px";


    creditsContainer.appendChild(credit);
}


/* =========================================================
   CREATE MULTIPLE STREAMS
   ========================================================= */

creditData.forEach((data, index) => {

    /*
       Alternate the credits between both sides.
    */

    const side =
        index % 2 === 0
            ? "left"
            : "right";

    createCredit(
        index,
        data,
        side
    );
});


/*
   Add additional copies so the background remains
   continuously populated while each credit loops.
*/

for (let i = 0; i < 12; i++) {

    const data =
        creditData[
            Math.floor(
                Math.random() *
                creditData.length
            )
        ];

    const side =
        Math.random() > .5
            ? "left"
            : "right";

    createCredit(
        i + 100,
        data,
        side
    );
}


/* =========================================================
   SHUTDOWN NOTICE
   =========================================================

   Currently "#".

   When you have the URL, simply change:

       href="#"

   to:

       href="https://iifsgfipnximqzuhsjvj.supabase.co/storage/v1/object/public/tredt-files/public/SHUTDOWN%20NOTICE%20OF%20VLEARN.pdf"

   ========================================================= */

const shutdownNotice =
    document.getElementById("shutdownNotice");

shutdownNotice.addEventListener("click", function(event) {

    if (this.getAttribute("href") === "#") {

        event.preventDefault();

        console.log(
            "Shutdown Notice link has not been configured yet."
        );
    }
});


/* =========================================================
   PAGE VISIBILITY OPTIMIZATION
   ========================================================= */

document.addEventListener(
    "visibilitychange",
    function() {

        if (document.hidden) {
            /*
               The browser automatically throttles
               requestAnimationFrame when hidden.
            */
        }
    }
);
</script>

</body>
</html>

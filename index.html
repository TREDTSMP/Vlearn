   RESET

body {

/* =========================================================
   SPACE
   ========================================================= */

.space {

    inset: 0;

    height: 100%;

   STAR CANVAS

   SUBTLE VIGNETTE

    inset: 0;

    height: 100%;

    overflow: hidden;

}

   CREDIT ROLE

    color: var(--credit-role);
}


/* =========================================================
   LEFT CREDIT STREAM
   ========================================================= */

.credit.left {

    left: var(--start);

    animation:

        floatLeft
        var(--duration)
        linear
        var(--delay)
        infinite;
}


/* =========================================================
   RIGHT CREDIT STREAM
   ========================================================= */

.credit.right {

    right: var(--start);

    animation:

        floatRight
        var(--duration)
        linear
        var(--delay)
        infinite;
}


/* =========================================================
   LEFT FLOATING ANIMATION
   ========================================================= */

@keyframes floatLeft {

    0% {

        transform:

            translate3d(
                0,
                0,
                0
            )

            rotate(
                var(--angle)
            )

            scale(
                0.80
            );

        opacity: 0;
    }


    7% {

    }


    25% {

        opacity: 0.68;

    55% {

    78% {

        opacity: 0.28;

    92% {

    }


    100% {

        transform:

            translate3d(
                var(--travel-x),
                -125vh,
                0
            )

            rotate(
                calc(
                    var(--angle) * -0.35
                )
            )

            scale(
                1.06
            );

        opacity: 0;
    }
}

   RIGHT FLOATING ANIMATION

<script>

/* =========================================================
   VLEARN SHUTDOWN PAGE
   STARFIELD ENGINE
   ========================================================= */


/* =========================================================
   CANVAS
   ========================================================= */

const canvas =
    document.getElementById(
        "stars"
    );

const ctx =
    canvas.getContext(
        "2d"
    );


/* =========================================================
   STAR SETTINGS
   ========================================================= */

let width = 0;
let height = 0;

let stars = [];

const STAR_COUNT = 560;


/* =========================================================
   RESIZE
   ========================================================= */

function resizeStars() {

    width =
        window.innerWidth;

    height =
        window.innerHeight;


    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    canvas.width =
        width * dpr;

    canvas.height =
        height * dpr;


    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    createStars();
}


/* =========================================================
   CREATE STARS
   ========================================================= */

function createStars() {

    stars = [];


    /*
       Create a large orbital field.

       Each star has:
       - orbital angle
       - orbital distance
       - radius
       - speed
       - opacity
       - twinkle phase
    */


    const maxDistance =
        Math.sqrt(
            width * width +
            height * height
        );


    for (
        let i = 0;
        i < STAR_COUNT;
        i++
    ) {

        stars.push({

            angle:
                Math.random() *
                Math.PI *
                2,


            distance:
                Math.random() *
                maxDistance,


            radius:
                Math.random() *
                1.35 +
                0.15,


            /*
               Very slow orbital movement.
            */

            speed:
                0.000025 +
                Math.random() *
                0.00017,


            alpha:
                0.22 +
                Math.random() *
                0.78,


            twinkle:
                Math.random() *
                Math.PI *
                2,


            twinkleSpeed:
                0.002 +
                Math.random() *
                0.018
        });
    }
}


/* =========================================================
   DRAW STARFIELD
   ========================================================= */

function drawStars(time) {

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    /*
       Central orbital point.
    */

    const centerX =
        width * 0.5;

    const centerY =
        height * 0.5;


    for (
        const star of stars
    ) {


        /*
           Revolve the star.
        */

        star.angle +=
            star.speed;


        /*
           Elliptical orbit.

           The Y axis is compressed slightly
           to create a cinematic space effect.
        */

        const x =
            centerX +
            Math.cos(
                star.angle
            ) *
            star.distance;


        const y =
            centerY +
            Math.sin(
                star.angle
            ) *
            star.distance *
            0.58;


        /*
           Twinkle.
        */

        const twinkle =
            0.70 +
            Math.sin(
                time *
                star.twinkleSpeed +
                star.twinkle
            ) *
            0.30;


        const alpha =
            star.alpha *
            twinkle;


        /*
           Don't draw stars outside
           the visible viewport.
        */

        if (

            x < -10 ||
            x > width + 10 ||
            y < -10 ||
            y > height + 10

        ) {

            continue;
        }


        /*
           Draw white star.
        */

        ctx.globalAlpha =
            alpha;

        ctx.fillStyle =
            "#ffffff";


        ctx.beginPath();


        ctx.arc(

            x,
            y,

            star.radius,

            0,
            Math.PI * 2

        );


        ctx.fill();
    }


    ctx.globalAlpha =
        1;


    requestAnimationFrame(
        drawStars
    );
}


/* =========================================================
   INITIALIZE STARFIELD
   ========================================================= */

window.addEventListener(
    "resize",
    resizeStars
);

resizeStars();


requestAnimationFrame(
    drawStars
);



/* =========================================================
   FLOATING CREDITS
   =========================================================

   IMPORTANT:

   The headings

       ATTRIBUTIONS
       POWERED BY
       IN MEMORIAM

   have deliberately been removed.

   All requested names and organizations remain.
   ========================================================= */


const creditData = [

    [
        "Soumya D. Das",
        "Head Developer"
    ],

    [
        "Ishaan Das",
        "Compiler and Designer"
    ],

    [
        "Kush Meena",
        "Head Designer"
    ],

    [
        "Arya Dogra",
        "Designer and Compiler"
    ],

    [
        "Naved Khan",
        "Designer and Compiler"
    ],

    [
        "Hemang Chugh",
        "Music Artist"
    ],

    [
        "Benjamin Samuel",
        "Music Artist"
    ],

    [
        "Sam Thomas",
        "Designer and Music Artist"
    ],

    [
        "Aaron S. Santhosh",
        "Server Management"
    ],

    [
        "LearnCBSE",
        "Content"
    ],

    [
        "Aryan Bhatt Bhutta Company",
        ""
    ],

    [
        "Aryan Bhatt Software Foundation",
        ""
    ],

    [
        "admin1",
        ""
    ]

];


/* =========================================================
   CREDITS CONTAINER
   ========================================================= */

const creditsContainer =
    document.getElementById(
        "credits"
    );


/* =========================================================
   CREATE CREDIT
   ========================================================= */

function createCredit(
    data,
    side,
    index
) {


    const credit =
        document.createElement(
            "div"
        );


    credit.className =
        "credit " +
        side;


    /*
       NAME
    */

    const name =
        document.createElement(
            "strong"
        );


    name.textContent =
        data[0];


    credit.appendChild(
        name
    );


    /*
       ROLE

       Only create it when
       a role actually exists.
    */

    if (
        data[1] &&
        data[1].trim() !== ""
    ) {

        const role =
            document.createElement(
                "span"
            );


        role.textContent =
            data[1];


        credit.appendChild(
            role
        );
    }


    /*
       Random horizontal starting
       position.
    */

    const start =
        2 +
        Math.random() *
        23;


    /*
       Different animation durations
       prevent synchronized movement.
    */

    const duration =
        18 +
        Math.random() *
        16;


    /*
       Negative delays make the page
       appear populated immediately.
    */

    const delay =
        -Math.random() *
        duration;


    /*
       LEFT credits tilt left.

       RIGHT credits tilt right.
    */

    const angle =
        side === "left"

            ? -10 -
              Math.random() *
              20

            : 10 +
              Math.random() *
              20;


    /*
       Horizontal travel.

       LEFT:
       bottom-left -> upper-center

       RIGHT:
       bottom-right -> upper-center
    */

    const travel =
        side === "left"

            ? 180 +
              Math.random() *
              320

            : -(
                180 +
                Math.random() *
                320
              );


    /*
       Apply CSS variables.
    */

    credit.style.setProperty(
        "--start",
        start + "vw"
    );


    credit.style.setProperty(
        "--duration",
        duration + "s"
    );


    credit.style.setProperty(
        "--delay",
        delay + "s"
    );


    credit.style.setProperty(
        "--angle",
        angle + "deg"
    );


    credit.style.setProperty(
        "--travel-x",
        travel + "px"
    );


    /*
       Random vertical offset.

       This prevents all credits
       from entering at exactly
       the same time.
    */

    credit.style.bottom =
        (
            -80 -
            Math.random() *
            600
        ) + "px";


    creditsContainer.appendChild(
        credit
    );
}


/* =========================================================
   CREATE INITIAL CREDIT STREAM
   ========================================================= */

creditData.forEach(
    (
        data,
        index
    ) => {

        const side =
            index % 2 === 0
                ? "left"
                : "right";


        createCredit(
            data,
            side,
            index
        );
    }
);


/* =========================================================
   ADD ADDITIONAL FLOATING CREDITS
   =========================================================

   Additional instances keep both sides
   continuously populated.
   ========================================================= */

for (
    let i = 0;
    i < 15;
    i++
) {


    const data =
        creditData[
            Math.floor(
                Math.random() *
                creditData.length
            )
        ];


    const side =
        Math.random() < 0.5
            ? "left"
            : "right";


    createCredit(
        data,
        side,
        i + 100
    );
}


/* =========================================================
   PERFORMANCE / VISIBILITY
   ========================================================= */

document.addEventListener(
    "visibilitychange",
    function() {

        /*
           requestAnimationFrame is automatically
           throttled by the browser when the tab
           becomes hidden.
        */

    }
);

</script>
